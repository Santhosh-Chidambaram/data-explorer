<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f5f5f5;
    }
    .container {
      background-color: #ffffff;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .button {
      display: inline-block;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 12px 20px;
      font-size: 16px;
      text-decoration: none;
      margin: 10px 0;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Welcome to the DataExplorer</h2>
    <p>Please select an action to continue:</p>
    <a href="/upload" class="button">Upload Analytics CSV</a><br>
    <a href="/dashboard" class="button">View Analytics Table</a><br>
    <a href="/query-builder" class="button">Check Query Builder</a><br>
  </div>
</body>
</html>
